name: Build and publish slides

on:
  push:
    branches: [main]
    paths: &slide-paths
      - Slides.md
      - assets/**
      - Justfile
      - .github/workflows/pages.yml
  pull_request:
    paths: *slide-paths

permissions:
  contents: read

env:
  JUST_VERSION: 1.59.0
  # SHA-256 of just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz (from the release's SHA256SUMS)
  JUST_SHA256: 409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install just
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tarball="just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          gh release download "${JUST_VERSION}" --repo casey/just --pattern "${tarball}" --dir "${RUNNER_TEMP}"
          echo "${JUST_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/just"
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}/just" just
          echo "${RUNNER_TEMP}/just" >> "${GITHUB_PATH}"

      - name: Build slides
        run: just build

      - name: Upload PDF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slides-pdf
          path: _site/slides.pdf
          retention-days: 5
          if-no-files-found: error

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
